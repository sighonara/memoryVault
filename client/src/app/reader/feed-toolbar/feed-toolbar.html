<mat-toolbar>
  <span class="title">{{ store.selectedTitle() }}</span>
  <span class="spacer"></span>
  <button mat-icon-button (click)="toggleViewMode()"
    [matTooltip]="viewModeLabel()" [attr.aria-label]="viewModeLabel()">
    <mat-icon>{{ store.viewMode() === 'LIST' ? 'view_agenda' : 'view_list' }}</mat-icon>
  </button>
  <button mat-icon-button (click)="toggleSortOrder()"
    [matTooltip]="sortOrderLabel()" [attr.aria-label]="sortOrderLabel()">
    <mat-icon>{{ store.sortOrder() === 'NEWEST_FIRST' ? 'arrow_downward' : 'arrow_upward' }}</mat-icon>
  </button>
  <button mat-button (click)="store.setUnreadOnly(!store.unreadOnly())">
    {{ store.unreadOnly() ? 'Show All' : 'Show Unread' }}
  </button>
  <button mat-icon-button (click)="store.refreshItems()" matTooltip="Refresh" aria-label="Refresh">
    <mat-icon>refresh</mat-icon>
  </button>
</mat-toolbar>
