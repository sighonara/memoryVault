spring.flyway.clean-on-validation-error=false

# JWT Configuration
memoryvault.jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hs256-signing!!
memoryvault.jwt.expiration-hours=24

# CORS
memoryvault.cors.allowed-origins=http://localhost
memoryvault.websocket.allowed-origins=*
memoryvault.websocket.heartbeat-interval-ms=10000
memoryvault.websocket.relay-executor-pool-size=2

# Encryption
MEMORYVAULT_ENCRYPTION_KEY=test-encryption-key-for-unit-tests

# Billing (stub values — StripeService is @Profile("!test") so these are only for safety)
memoryvault.billing.free-feed-limit=100
memoryvault.billing.grace-period-days=30
memoryvault.billing.video-purge-cron=-
memoryvault.billing.stripe-secret-key=sk_test_disabled
memoryvault.billing.stripe-webhook-secret=whsec_disabled
memoryvault.billing.stripe-premium-monthly-price-id=price_pm
memoryvault.billing.stripe-premium-annual-price-id=price_pa
memoryvault.billing.stripe-archive-monthly-price-id=price_am
memoryvault.billing.stripe-archive-annual-price-id=price_aa
memoryvault.billing.premium-video-hours-limit=20
memoryvault.billing.archive-video-hours-limit=100
