# Local profile — active by default (spring.profiles.default=local)

# Database (Docker Compose local)
spring.datasource.url=jdbc:postgresql://localhost:5433/memoryvault
spring.datasource.username=memoryvault
spring.datasource.password=memoryvault
spring.datasource.driver-class-name=org.postgresql.Driver

# CORS
memoryvault.cors.allowed-origins=http://localhost:4200

# JWT (dev-only secret — NEVER use in production)
memoryvault.jwt.secret=dev-secret-key-change-in-production-must-be-at-least-256-bits-long!!

# GraphiQL (dev only)
spring.graphql.graphiql.enabled=true

# Encryption (dev-only key — NEVER use in production)
MEMORYVAULT_ENCRYPTION_KEY=dev-encryption-key-change-in-production

# WebSocket
memoryvault.websocket.allowed-origins=${memoryvault.cors.allowed-origins}

# Stripe — use test-mode keys locally; set to "disabled" to skip Stripe calls in local dev
STRIPE_SECRET_KEY=sk_test_disabled
STRIPE_WEBHOOK_SECRET=whsec_disabled
STRIPE_PREMIUM_MONTHLY_PRICE_ID=price_test_premium_monthly
STRIPE_PREMIUM_ANNUAL_PRICE_ID=price_test_premium_annual
STRIPE_BACKUP_MONTHLY_PRICE_ID=price_test_backup_monthly
STRIPE_BACKUP_ANNUAL_PRICE_ID=price_test_backup_annual
