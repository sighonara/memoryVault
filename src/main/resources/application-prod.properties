# Prod profile — activate with SPRING_PROFILES_ACTIVE=prod

# Database (RDS)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# CORS
memoryvault.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT (from environment / Secrets Manager)
memoryvault.jwt.secret=${JWT_SECRET}

# GraphiQL disabled in production
spring.graphql.graphiql.enabled=false

# WebSocket
memoryvault.websocket.allowed-origins=${memoryvault.cors.allowed-origins}

# AWS S3 storage
memoryvault.storage.s3-bucket=${MEMORYVAULT_STORAGE_S3__BUCKET}
memoryvault.storage.s3-region=${MEMORYVAULT_STORAGE_S3__REGION:us-east-1}

# AWS CloudWatch Logs
# The JSON log file must be written to the container path that is bind-mounted to the
# host's /var/log/memoryvault, which the CloudWatch agent tails (see user_data.sh).
memoryvault.logging.path=/app/logs
memoryvault.logging.cloudwatch-log-group=${MEMORYVAULT_LOGGING_CLOUDWATCH__LOG__GROUP:/memoryvault/app}
memoryvault.logging.cloudwatch-region=${MEMORYVAULT_LOGGING_CLOUDWATCH__REGION:us-east-1}

# AWS Cognito
memoryvault.cognito.region=${MEMORYVAULT_COGNITO_REGION:us-east-1}
memoryvault.cognito.user-pool-id=${MEMORYVAULT_COGNITO_USER__POOL__ID}
memoryvault.cognito.client-id=${MEMORYVAULT_COGNITO_CLIENT__ID}

# Internal API key for Lambda -> EC2 sync triggers (generated by Terraform)
memoryvault.internal.api-key=${MEMORYVAULT_INTERNAL_API__KEY}

# Backup jobs (Phase 10) — scheduled in-process by SpringJobScheduler, which records every
# run as a SyncJob. Unlike feed/YouTube sync (EventBridge -> Lambda -> /api/internal/sync/*),
# these intentionally do not use EventBridge: a code-only change, no terraform (decided
# 2026-11-12). application.properties defaults them to "-" (disabled), which left them off
# in prod until now. Values are the Phase 10 design defaults; times are UTC (container TZ).
# Upload: every 6 hours; each run takes max-uploads-per-day / 4 PENDING records.
memoryvault.backup.upload-cron=0 0 */6 * * *
# Health check: daily at 06:00 UTC.
memoryvault.backup.health-check-cron=0 0 6 * * *
